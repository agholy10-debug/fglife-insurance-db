<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遠雄人壽保險商品查詢系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        
        .header {
            background: rgba(0,0,0,0.3);
            padding: 20px 40px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .header p {
            color: #8892b0;
            font-size: 14px;
        }
        
        .container {
            display: flex;
            min-height: calc(100vh - 80px);
        }
        
        .sidebar {
            width: 280px;
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-right: 1px solid rgba(255,255,255,0.1);
        }
        
        .sidebar h3 {
            color: #64ffda;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }
        
        .search-box {
            margin-bottom: 25px;
        }
        
        .search-box input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 14px;
        }
        
        .search-box input::placeholder {
            color: #8892b0;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #64ffda;
        }
        
        .category-list {
            list-style: none;
        }
        
        .category-item {
            padding: 12px 15px;
            margin-bottom: 5px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }
        
        .category-item:hover {
            background: rgba(255,255,255,0.1);
        }
        
        .category-item.active {
            background: rgba(100, 255, 218, 0.15);
            border-left: 3px solid #64ffda;
        }
        
        .category-item .name {
            font-size: 14px;
        }
        
        .category-item .count {
            background: rgba(255,255,255,0.1);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            color: #8892b0;
        }
        
        .category-item .counts {
            display: flex;
            gap: 8px;
            font-size: 11px;
        }
        
        .category-item .現售 {
            color: #64ffda;
        }
        
        .category-item .停售 {
            color: #ff6b6b;
        }
        
        .main {
            flex: 1;
            padding: 25px 35px;
            overflow-y: auto;
            max-height: calc(100vh - 80px);
        }
        
        .stats-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        .stat-item {
            background: rgba(255,255,255,0.05);
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-item .number {
            font-size: 28px;
            font-weight: bold;
            color: #64ffda;
        }
        
        .stat-item .label {
            font-size: 12px;
            color: #8892b0;
            margin-top: 5px;
        }
        
        .filter-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-btn {
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            background: transparent;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        
        .filter-btn:hover {
            border-color: #64ffda;
        }
        
        .filter-btn.active {
            background: #64ffda;
            color: #1a1a2e;
            border-color: #64ffda;
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 15px;
        }
        
        .product-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 18px;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .product-card:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(100, 255, 218, 0.3);
            transform: translateY(-2px);
        }
        
        .product-card .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 0;
            margin-bottom: 12px;
            border: none;
            background: transparent;
        }
        
        .product-card .status {
            font-size: 10px;
            padding: 3px 10px;
            border-radius: 10px;
            font-weight: bold;
            flex-shrink: 0;
        }
        
        .product-card .status.現售 {
            background: rgba(100, 255, 218, 0.2);
            color: #64ffda;
        }
        
        .product-card .status.停售 {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }
        
        .product-card .status.附約 {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
        }
        
        .product-card .name {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            line-height: 1.4;
            flex: 1;
            padding-right: 10px;
        }
        
        .product-card .meta {
            font-size: 11px;
            color: #8892b0;
        }
        
        .product-card .meta span {
            margin-right: 15px;
        }
        
        .product-card .size {
            font-size: 11px;
            color: #8892b0;
            margin-top: 8px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px;
            color: #8892b0;
        }
        
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #8892b0;
        }
        
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: #64ffda;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 20px;
            color: #1a1a2e;
        }
        
        .back-to-top.show {
            opacity: 1;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-content {
            width: 90%;
            height: 90%;
            background: #1a1a2e;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }
        
        .modal-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 15px 20px;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        
        .modal-header h4 {
            font-size: 14px;
            max-width: 80%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .modal-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            padding: 5px 10px;
        }
        
        .modal iframe {
            width: 100%;
            height: 100%;
            border: none;
            margin-top: 60px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
                <h1>🏦 遠雄人壽保險商品查詢系統</h1>
                <p>共 <span id="total-count">0</span> 個商品 | 現售 + 停售完整收錄</p>
            </div>
            <div id="user-info" style="display:none; align-items:center; gap:10px;">
                <span style="color:#64ffda;">👤 <span id="username-display"></span></span>
                <button onclick="logout()" style="color:#ff6b6b; background:none; border:1px solid #ff6b6b; padding:8px 16px; border-radius:6px; cursor:pointer;">登出</button>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://sb-publishable-oxx6od0qh3h-xdo-xwgmspe-q-sswio9u4.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNiLXB1Ymxpc2hhYmxlLW94eDZvZDBxaDNoLWRvLXh3Z21zcGUtcS1zc3dpbzluNCIsImlhdCI6MTY0NDM0OTIwMCwiZXhwIjoxOTU5OTM1MjAwfQ.xxxx';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
                return;
            }
            // 從 email 取出使用者名稱
            const email = session.user.email;
            const username = email.split('@')[0];
            document.getElementById('username-display').textContent = username;
            document.getElementById('user-info').style.display = 'flex';
        }
        
        async function logout() {
            await supabase.auth.signOut();
            localStorage.removeItem('fglife_session');
            window.location.href = 'login.html';
        }
        
        checkAuth();
    </script>
    
    <div class="container">
        <div class="sidebar">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 搜尋商品...">
            </div>
            
            <h3>商品分類</h3>
            <ul class="category-list" id="category-list">
                <li class="category-item active" data-category="">
                    <span class="name">全部商品</span>
                    <span class="count" id="all-count">0</span>
                </li>
            </ul>
        </div>
        
        <div class="main">
            <div class="stats-bar" id="stats-bar"></div>
            
            <div class="filter-bar">
                <button class="filter-btn active" data-filter="all">全部</button>
                <button class="filter-btn" data-filter="現售">現售</button>
                <button class="filter-btn" data-filter="停售">停售</button>
                <button class="filter-btn" data-filter="主約">主約</button>
                <button class="filter-btn" data-filter="附約">附約</button>
            </div>
            
            <div id="products-grid" class="products-grid">
                <div class="loading">載入中...</div>
            </div>
        </div>
    </div>
    
    <div class="back-to-top" onclick="window.scrollTo({top:0})">↑</div>
    
    <div class="modal" id="pdf-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h4 id="modal-title">PDF 檢視</h4>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <iframe id="pdf-frame"></iframe>
        </div>
    </div>
    
    <script>
        let allProducts = [];
        let currentFilter = 'all';
        let currentCategory = '';
        
        // 載入分類統計
        async function loadCategories() {
            const res = await fetch('./data/products.json');
            const allProducts = await res.json();
            
            // 統計分類
            const stats = {};
            allProducts.forEach(p => {
                if (!stats[p.category]) {
                    stats[p.category] = { 現售: { 主約: 0, 附約: 0 }, 停售: { 主約: 0, 附約: 0 } };
                }
                stats[p.category][p.status][p.type]++;
            });
            
            const total = allProducts.length;
            document.getElementById('total-count').textContent = total;
            document.getElementById('all-count').textContent = total;
            
            const list = document.getElementById('category-list');
            const statsBar = document.getElementById('stats-bar');
            
            let html = `
                <li class="category-item active" data-category="">
                    <span class="name">全部商品</span>
                    <span class="count">${total}</span>
                </li>
            `;
            
            let statsHtml = `
                <div class="stat-item">
                    <div class="number">${total}</div>
                    <div class="label">總商品數</div>
                </div>
            `;
            
            for (const [cat, counts] of Object.entries(stats)) {
                const 現售 = counts.現售.主約 + counts.現售.附約;
                const 停售 = counts.停售.主約 + counts.停售.附約;
                const catTotal = 現售 + 停售;
                
                html += `
                    <li class="category-item" data-category="${cat}">
                        <span class="name">${cat}</span>
                        <div class="counts">
                            <span class="現售">現${現售}</span>
                            <span class="停售">停${停售}</span>
                        </div>
                    </li>
                `;
                
                statsHtml += `
                    <div class="stat-item">
                        <div class="number">${catTotal}</div>
                        <div class="label">${cat}</div>
                    </div>
                `;
            }
            
            list.innerHTML = html;
            statsBar.innerHTML = statsHtml;
            
            // 綁定分類點擊事件
            document.querySelectorAll('.category-item').forEach(item => {
                item.addEventListener('click', () => {
                    document.querySelectorAll('.category-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    currentCategory = item.dataset.category;
                    loadProducts(allProducts);
                });
            });
        }
        
        // 載入商品列表
        async function loadProducts(allProducts) {
            const grid = document.getElementById('products-grid');
            grid.innerHTML = '<div class="loading">載入中...</div>';
            
            if (!allProducts) {
                const res = await fetch('./data/products.json');
                allProducts = await res.json();
            }
            
            window.allProducts = allProducts;
            renderProducts();
        }
        
        // 篩選商品
        function filterProducts() {
            renderProducts();
        }
        
        function renderProducts() {
            const grid = document.getElementById('products-grid');
            const searchValue = document.getElementById('search-input').value.toLowerCase();
            
            let filtered = allProducts;
            
            // 狀態篩選
            if (currentFilter === '現售' || currentFilter === '停售') {
                filtered = filtered.filter(p => p.status === currentFilter);
            } else if (currentFilter === '主約') {
                filtered = filtered.filter(p => !p.is_rider);
            } else if (currentFilter === '附約') {
                filtered = filtered.filter(p => p.is_rider);
            }
            
            // 搜尋篩選
            if (searchValue) {
                filtered = filtered.filter(p => 
                    p.filename.toLowerCase().includes(searchValue)
                );
            }
            
            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>找不到符合條件的商品</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = filtered.map(p => {
                const sizeKB = Math.round(p.filesize / 1024);
                const sizeStr = sizeKB > 1024 ? `${(sizeKB/1024).toFixed(1)} MB` : `${sizeKB} KB`;
                const pdfUrl = p.filepath.replace('/mnt/c/Users/holya/insurance-db/documents/fglife/', '');
                
                return `
                    <div class="product-card" onclick="openPdf('${encodeURIComponent(pdfUrl)}', '${p.filename.replace(/'/g, "\\'")}')">
                        <div class="header">
                            <div class="name">${p.filename.replace('.pdf','')}</div>
                            <span class="status ${p.status}">${p.status}</span>
                        </div>
                        <div class="meta">
                            <span>📁 ${p.category}</span>
                            <span>📋 ${p.type}</span>
                        </div>
                        <div class="size">📦 ${sizeStr}</div>
                    </div>
                `;
            }).join('');
        }
        
        // 開啟 PDF
        function openPdf(encodedPath, title) {
            const modal = document.getElementById('pdf-modal');
            const frame = document.getElementById('pdf-frame');
            const titleEl = document.getElementById('modal-title');
            
            frame.src = `/pdf/${encodedPath}`;
            titleEl.textContent = title;
            modal.classList.add('show');
        }
        
        // 關閉 Modal
        function closeModal() {
            const modal = document.getElementById('pdf-modal');
            const frame = document.getElementById('pdf-frame');
            modal.classList.remove('show');
            frame.src = '';
        }
        
        // 事件監聽
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                filterProducts();
            });
        });
        
        document.getElementById('search-input').addEventListener('input', () => {
            filterProducts();
        });
        
        // ESC 關閉 Modal
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
        });
        
        // 初始化
        loadCategories();
    </script>
</body>
</html>
