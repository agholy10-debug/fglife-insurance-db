<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遠雄人壽保險商品查詢系統</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        .header {
            background: rgba(0,0,0,0.3);
            padding: 20px 40px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .header h1 { font-size: 24px; margin-bottom: 5px; }
        .header p { color: #8892b0; font-size: 14px; }
        .container { display: flex; min-height: calc(100vh - 80px); }
        .sidebar {
            width: 280px;
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-right: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar h3 {
            color: #64ffda;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }
        .search-box { margin-bottom: 25px; }
        .search-box input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 14px;
        }
        .search-box input::placeholder { color: #8892b0; }
        .search-box input:focus { outline: none; border-color: #64ffda; }
        .category-list { list-style: none; }
        .category-item {
            padding: 12px 15px;
            margin-bottom: 5px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }
        .category-item:hover { background: rgba(255,255,255,0.1); }
        .category-item.active {
            background: rgba(100, 255, 218, 0.15);
            border-left: 3px solid #64ffda;
        }
        .category-item .count {
            background: rgba(255,255,255,0.1);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            color: #8892b0;
        }
        .main { flex: 1; padding: 25px 35px; overflow-y: auto; max-height: calc(100vh - 80px); }
        .stats-bar { display: flex; gap: 20px; margin-bottom: 25px; flex-wrap: wrap; }
        .stat-item {
            background: rgba(255,255,255,0.05);
            padding: 15px 25px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-item .number { font-size: 28px; font-weight: bold; color: #64ffda; }
        .stat-item .label { font-size: 12px; color: #8892b0; margin-top: 5px; }
        .filter-bar { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        .filter-btn {
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            background: transparent;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }
        .filter-btn:hover { border-color: #64ffda; }
        .filter-btn.active { background: #64ffda; color: #1a1a2e; border-color: #64ffda; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; }
        .product-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 18px;
            transition: all 0.3s;
        }
        .product-card:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(100, 255, 218, 0.3);
            transform: translateY(-2px);
        }
        .product-card .name { font-size: 14px; font-weight: 500; margin-bottom: 8px; line-height: 1.4; }
        .product-card .meta { font-size: 11px; color: #8892b0; margin-bottom: 8px; }
        .product-card .meta span { margin-right: 15px; }
        .product-card .actions { display: flex; gap: 10px; margin-top: 12px; }
        .product-card .btn {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            text-align: center;
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }
        .product-card .btn-view {
            background: rgba(100, 255, 218, 0.15);
            color: #64ffda;
            border: 1px solid rgba(100, 255, 218, 0.3);
        }
        .product-card .btn-view:hover { background: rgba(100, 255, 218, 0.25); }
        .status-badge {
            display: inline-block;
            font-size: 10px;
            padding: 3px 10px;
            border-radius: 10px;
            font-weight: bold;
            margin-left: 8px;
        }
        .status-badge.現售 { background: rgba(100, 255, 218, 0.2); color: #64ffda; }
        .status-badge.停售 { background: rgba(255, 107, 107, 0.2); color: #ff6b6b; }
        .type-badge {
            display: inline-block;
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 8px;
            background: rgba(255, 215, 0, 0.15);
            color: #ffd700;
            margin-left: 5px;
        }
        .loading { text-align: center; padding: 40px; color: #8892b0; }
        .empty-state { text-align: center; padding: 60px; color: #8892b0; }
        .empty-state .icon { font-size: 48px; margin-bottom: 15px; }
        .notice {
            background: rgba(255, 107, 107, 0.15);
            border: 1px solid rgba(255, 107, 107, 0.3);
            border-radius: 10px;
            padding: 15px 20px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #ff6b6b;
        }
        .notice strong { color: #ff6b6b; }
        .notice a { color: #64ffda; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏦 遠雄人壽保險商品查詢系統</h1>
        <p>共 <span id="total-count">0</span> 個商品 | 現售 + 停售完整收錄</p>
    </div>
    
    <div class="container">
        <div class="sidebar">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 搜尋商品...">
            </div>
            
            <h3>商品分類</h3>
            <ul class="category-list" id="category-list">
                <li class="category-item active" data-category="">
                    <span class="name">全部商品</span>
                    <span class="count" id="all-count">0</span>
                </li>
            </ul>
            
            <div class="notice">
                <strong>⚠️ 注意</strong><br>
                本靜態版本可在 GitHub Pages 瀏覽。<br>
                PDF 下載需要從<a href="https://www.fglife.com.tw/initGoodsTermsO.html" target="_blank">遠雄人壽官網</a>取得。
            </div>
        </div>
        
        <div class="main">
            <div class="stats-bar" id="stats-bar"></div>
            
            <div class="filter-bar">
                <button class="filter-btn active" data-filter="all">全部</button>
                <button class="filter-btn" data-filter="現售">現售</button>
                <button class="filter-btn" data-filter="停售">停售</button>
                <button class="filter-btn" data-filter="主約">主約</button>
                <button class="filter-btn" data-filter="附約">附約</button>
            </div>
            
            <div id="products-grid" class="products-grid">
                <div class="loading">載入中...</div>
            </div>
        </div>
    </div>
    
    <script>
        let allProducts = [];
        let currentFilter = 'all';
        let currentCategory = '';
        
        // 載入商品資料
        async function loadProducts() {
            try {
                const res = await fetch('data/products.json');
                allProducts = await res.json();
                updateStats();
                renderProducts();
            } catch (e) {
                document.getElementById('products-grid').innerHTML = '<div class="loading">資料載入失敗</div>';
            }
        }
        
        // 更新統計
        function updateStats() {
            const categories = {};
            let total = allProducts.length;
            
            allProducts.forEach(p => {
                if (!categories[p.category]) {
                    categories[p.category] = { 現售: 0, 停售: 0 };
                }
                categories[p.category][p.status]++;
            });
            
            document.getElementById('total-count').textContent = total;
            document.getElementById('all-count').textContent = total;
            
            // 側邊欄分類
            const list = document.getElementById('category-list');
            let html = `
                <li class="category-item active" data-category="">
                    <span class="name">全部商品</span>
                    <span class="count">${total}</span>
                </li>
            `;
            
            // 統計列
            const statsBar = document.getElementById('stats-bar');
            let statsHtml = `
                <div class="stat-item">
                    <div class="number">${total}</div>
                    <div class="label">總商品數</div>
                </div>
            `;
            
            for (const [cat, counts] of Object.entries(categories)) {
                const catTotal = counts.現售 + counts.停售;
                html += `
                    <li class="category-item" data-category="${cat}">
                        <span class="name">${cat}</span>
                        <span class="count">${catTotal}</span>
                    </li>
                `;
                statsHtml += `
                    <div class="stat-item">
                        <div class="number">${catTotal}</div>
                        <div class="label">${cat}</div>
                    </div>
                `;
            }
            
            list.innerHTML = html;
            statsBar.innerHTML = statsHtml;
            
            // 綁定分類點擊
            document.querySelectorAll('.category-item').forEach(item => {
                item.addEventListener('click', () => {
                    document.querySelectorAll('.category-item').forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    currentCategory = item.dataset.category;
                    renderProducts();
                });
            });
        }
        
        // 篩選並顯示商品
        function renderProducts() {
            const grid = document.getElementById('products-grid');
            const searchValue = document.getElementById('search-input').value.toLowerCase();
            
            let filtered = allProducts;
            
            // 分類篩選
            if (currentCategory) {
                filtered = filtered.filter(p => p.category === currentCategory);
            }
            
            // 狀態篩選
            if (currentFilter === '現售' || currentFilter === '停售') {
                filtered = filtered.filter(p => p.status === currentFilter);
            } else if (currentFilter === '主約') {
                filtered = filtered.filter(p => !p.is_rider);
            } else if (currentFilter === '附約') {
                filtered = filtered.filter(p => p.is_rider);
            }
            
            // 搜尋篩選
            if (searchValue) {
                filtered = filtered.filter(p => p.filename.toLowerCase().includes(searchValue));
            }
            
            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>找不到符合條件的商品</p>
                    </div>
                `;
                return;
            }
            
            grid.innerHTML = filtered.map(p => `
                <div class="product-card">
                    <div class="name">
                        ${p.filename.replace('.pdf','')}
                        <span class="status-badge ${p.status}">${p.status}</span>
                        ${p.is_rider ? '<span class="type-badge">附約</span>' : ''}
                    </div>
                    <div class="meta">
                        <span>📁 ${p.category}</span>
                        <span>📋 ${p.type}</span>
                    </div>
                    <div class="actions">
                        <a href="https://www.fglife.com.tw/initGoodsTermsO.html" target="_blank" class="btn btn-view">
                            🔗 前往遠雄官網下載
                        </a>
                    </div>
                </div>
            `).join('');
        }
        
        // 事件監聽
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderProducts();
            });
        });
        
        document.getElementById('search-input').addEventListener('input', renderProducts);
        
        // 初始化
        loadProducts();
    </script>
</body>
</html>
