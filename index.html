<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遠雄人壽保險商品理賠查詢系統</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        .header {
            background: rgba(0,0,0,0.3);
            padding: 20px 40px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header h1 { font-size: 24px; margin-bottom: 5px; display: flex; align-items: center; gap: 10px; }
        .header p { color: #8892b0; font-size: 14px; }
        .container { display: flex; min-height: calc(100vh - 80px); }
        
        /* 側邊欄 */
        .sidebar {
            width: 300px;
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-right: 1px solid rgba(255,255,255,0.1);
            overflow-y: auto;
            max-height: calc(100vh - 80px);
        }
        .sidebar h3 {
            color: #64ffda;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }
        .search-box { margin-bottom: 20px; }
        .search-box input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 14px;
        }
        .search-box input:focus { outline: none; border-color: #64ffda; }
        
        /* 分類清單 */
        .category-section { margin-bottom: 20px; }
        .category-title {
            font-size: 11px;
            color: #8892b0;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            padding-left: 5px;
        }
        .category-list { list-style: none; }
        .category-item {
            padding: 10px 12px;
            margin-bottom: 3px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
            font-size: 13px;
        }
        .category-item:hover { background: rgba(255,255,255,0.1); }
        .category-item.active { background: rgba(100, 255, 218, 0.15); border-left: 3px solid #64ffda; }
        .category-item .count {
            background: rgba(255,255,255,0.1);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            color: #8892b0;
        }
        .category-item .type-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 5px;
        }
        .type-badge.實支實付 { background: rgba(100, 255, 218, 0.2); color: #64ffda; }
        .type-badge.日額型 { background: rgba(255, 215, 0, 0.2); color: #ffd700; }
        .type-badge.手術 { background: rgba(255, 107, 107, 0.2); color: #ff6b6b; }
        .type-badge.癌症 { background: rgba(255, 100, 150, 0.2); color: #ff64b4; }
        .type-badge.重大疾病 { background: rgba(150, 100, 255, 0.2); color: #b264ff; }
        .type-badge.長照 { background: rgba(100, 200, 255, 0.2); color: #64c8ff; }
        .type-badge.意外 { background: rgba(255, 165, 100, 0.2); color: #ffa564; }
        .type-badge.海外 { background: rgba(100, 255, 200, 0.2); color: #64ffc8; }
        .type-badge.其他 { background: rgba(200, 200, 200, 0.2); color: #ccc; }
        
        /* 主內容區 */
        .main { flex: 1; padding: 25px 35px; overflow-y: auto; max-height: calc(100vh - 80px); }
        
        /* 篩選列 */
        .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        .filter-btn {
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            background: transparent;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .filter-btn:hover { border-color: #64ffda; }
        .filter-btn.active { background: #64ffda; color: #1a1a2e; border-color: #64ffda; }
        
        /* 商品卡片 */
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 15px; }
        .product-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 18px;
            transition: all 0.3s;
            cursor: pointer;
        }
        .product-card:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(100, 255, 218, 0.3);
            transform: translateY(-2px);
        }
        .product-card .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .product-card .name { font-size: 14px; font-weight: 500; line-height: 1.4; flex: 1; padding-right: 10px; }
        .product-card .code { font-size: 11px; color: #64ffda; background: rgba(100, 255, 218, 0.1); padding: 3px 8px; border-radius: 4px; margin-left: 8px; }
        .product-card .type-tag {
            font-size: 10px;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            white-space: nowrap;
        }
        .product-card .status-tag {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 8px;
            margin-left: 5px;
        }
        .status-tag.現售 { background: rgba(100, 255, 218, 0.15); color: #64ffda; }
        .status-tag.停售 { background: rgba(255, 107, 107, 0.15); color: #ff6b6b; }
        
        .product-card .desc { font-size: 12px; color: #8892b0; margin-bottom: 12px; line-height: 1.5; }
        .product-card .benefits-preview { font-size: 11px; color: #aaa; }
        .product-card .benefits-preview span { 
            display: inline-block;
            background: rgba(255,255,255,0.05);
            padding: 3px 8px;
            border-radius: 4px;
            margin: 2px 4px 2px 0;
            font-size: 10px;
        }
        .product-card .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.05); }
        .product-card .meta { font-size: 11px; color: #666; }
        .product-card .view-btn {
            font-size: 12px;
            color: #64ffda;
            text-decoration: none;
            padding: 5px 12px;
            border: 1px solid rgba(100, 255, 218, 0.3);
            border-radius: 6px;
            transition: all 0.2s;
        }
        .product-card .view-btn:hover { background: rgba(100, 255, 218, 0.15); }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            overflow-y: auto;
        }
        .modal.show { display: flex; }
        .modal-content {
            width: 100%;
            max-width: 800px;
            background: #1a1a2e;
            border-radius: 16px;
            overflow: hidden;
            margin: 20px auto;
        }
        .modal-header {
            padding: 20px 25px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h2 { font-size: 18px; display: flex; align-items: center; gap: 10px; }
        .modal-header .close {
            background: none;
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            padding: 5px 10px;
            opacity: 0.7;
        }
        .modal-header .close:hover { opacity: 1; }
        .modal-body { padding: 25px; }
        
        /* 商品詳情 */
        .detail-section { margin-bottom: 25px; }
        .detail-section h4 {
            font-size: 13px;
            color: #64ffda;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(100, 255, 218, 0.2);
        }
        .detail-section h4 .icon { margin-right: 8px; }
        
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
        .info-item {
            background: rgba(255,255,255,0.03);
            padding: 12px 15px;
            border-radius: 8px;
            border-left: 3px solid #64ffda;
        }
        .info-item .label { font-size: 11px; color: #8892b0; margin-bottom: 5px; }
        .info-item .value { font-size: 14px; font-weight: 500; }
        
        /* 理賠項目表 */
        .benefits-table { width: 100%; border-collapse: collapse; }
        .benefits-table th {
            text-align: left;
            padding: 10px 12px;
            background: rgba(255,255,255,0.05);
            font-size: 11px;
            color: #8892b0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .benefits-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 13px;
        }
        .benefits-table tr:hover td { background: rgba(255,255,255,0.02); }
        .benefits-table .amount { color: #64ffda; font-weight: 500; }
        .benefits-table .note { color: #888; font-size: 11px; }
        
        /* 理算範例 */
        .calc-example {
            background: rgba(100, 255, 218, 0.05);
            border: 1px solid rgba(100, 255, 218, 0.2);
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
        }
        .calc-example h5 { font-size: 12px; color: #64ffda; margin-bottom: 10px; }
        .calc-example .scenario { font-size: 12px; color: #aaa; margin-bottom: 10px; padding: 8px; background: rgba(0,0,0,0.2); border-radius: 6px; }
        .calc-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .calc-row:last-child { border-bottom: none; font-weight: bold; color: #64ffda; }
        
        /* 警告提示 */
        .warning-box {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 12px;
            color: #ffd700;
            margin-top: 15px;
        }
        .warning-box strong { color: #ffd700; }
        
        /* 按鈕 */
        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: #64ffda;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn:hover { background: #4de8c7; transform: translateY(-1px); }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(100, 255, 218, 0.3);
            color: #64ffda;
        }
        .btn-outline:hover { background: rgba(100, 255, 218, 0.1); }
        
        /* 空狀態 */
        .empty-state { text-align: center; padding: 60px; color: #8892b0; }
        .empty-state .icon { font-size: 48px; margin-bottom: 15px; }
        .loading { text-align: center; padding: 40px; color: #8892b0; }
        
        /* 狀態標籤 */
        .type-tag.實支實付 { background: rgba(100, 255, 218, 0.15); color: #64ffda; }
        .type-tag.日額型 { background: rgba(255, 215, 0, 0.15); color: #ffd700; }
        .type-tag.手術醫療 { background: rgba(255, 107, 107, 0.15); color: #ff6b6b; }
        .type-tag.癌症險 { background: rgba(255, 100, 150, 0.15); color: #ff64b4; }
        .type-tag.特定傷病 { background: rgba(150, 100, 255, 0.15); color: #b264ff; }
        .type-tag.重大疾病 { background: rgba(150, 100, 255, 0.15); color: #b264ff; }
        .type-tag.長期照護 { background: rgba(100, 200, 255, 0.15); color: #64c8ff; }
        .type-tag.意外醫療 { background: rgba(255, 165, 100, 0.15); color: #ffa564; }
        .type-tag.海外突發疾病 { background: rgba(100, 255, 200, 0.15); color: #64ffc8; }
        .type-tag.壽險 { background: rgba(200, 200, 200, 0.15); color: #ccc; }
        .type-tag.年金 { background: rgba(255, 200, 100, 0.15); color: #ffc864; }
        .type-tag.還本 { background: rgba(100, 200, 150, 0.15); color: #64c896; }
        .type-tag.投資型 { background: rgba(150, 150, 255, 0.15); color: #9696ff; }
        .type-tag.團險 { background: rgba(255, 150, 100, 0.15); color: #ff9664; }
        .type-tag.醫療保本 { background: rgba(100, 255, 150, 0.15); color: #64ff96; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏦 遠雄人壽保險商品理賠查詢系統</h1>
        <p>共 <span id="total-count">0</span> 個商品 | 點選商品查看詳細理賠項目</p>
    </div>
    
    <div class="container">
        <div class="sidebar">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 搜尋商品...">
            </div>
            
            <div class="category-section">
                <div class="category-title">依狀態</div>
                <ul class="category-list" id="status-list">
                    <li class="category-item active" data-filter="all">
                        <span>全部商品</span>
                        <span class="count" id="count-all">0</span>
                    </li>
                    <li class="category-item" data-filter="現售">
                        <span>💼 現售</span>
                        <span class="count" id="count-onsale">0</span>
                    </li>
                    <li class="category-item" data-filter="停售">
                        <span>📦 停售</span>
                        <span class="count" id="count-discontinued">0</span>
                    </li>
                </ul>
            </div>
            
            <div class="category-section">
                <div class="category-title">依類型</div>
                <ul class="category-list" id="type-list">
                    <li class="category-item active" data-type="all">
                        <span>全部類型</span>
                        <span class="count" id="type-count-all">0</span>
                    </li>
                </ul>
            </div>
            
            <div class="category-section">
                <div class="category-title">理賠類型</div>
                <ul class="category-list" id="claim-type-list">
                    <li class="category-item active" data-claim="all">
                        <span>全部</span>
                        <span class="count" id="claim-count-all">0</span>
                    </li>
                    <li class="category-item" data-claim="實支實付">
                        <span>實支實付</span>
                        <span class="count" id="claim-count-實支實付">0</span>
                    </li>
                    <li class="category-item" data-claim="日額型">
                        <span>日額型</span>
                        <span class="count" id="claim-count-日額型">0</span>
                    </li>
                    <li class="category-item" data-claim="手術醫療">
                        <span>手術醫療</span>
                        <span class="count" id="claim-count-手術">0</span>
                    </li>
                    <li class="category-item" data-claim="癌症">
                        <span>癌症險</span>
                        <span class="count" id="claim-count-癌症">0</span>
                    </li>
                    <li class="category-item" data-claim="特定傷病">
                        <span>特定傷病</span>
                        <span class="count" id="claim-count-特定傷病">0</span>
                    </li>
                    <li class="category-item" data-claim="重大疾病">
                        <span>重大疾病</span>
                        <span class="count" id="claim-count-重大疾病">0</span>
                    </li>
                    <li class="category-item" data-claim="長照">
                        <span>長期照護</span>
                        <span class="count" id="claim-count-長照">0</span>
                    </li>
                    <li class="category-item" data-claim="意外">
                        <span>意外醫療</span>
                        <span class="count" id="claim-count-意外">0</span>
                    </li>
                </ul>
            </div>
        </div>
        
        <div class="main">
            <div class="filter-bar">
                <button class="filter-btn active" data-filter="all">全部</button>
                <button class="filter-btn" data-filter="現售">現售</button>
                <button class="filter-btn" data-filter="停售">停售</button>
                <button class="filter-btn" data-filter="主約">主約</button>
                <button class="filter-btn" data-filter="附約">附約</button>
            </div>
            
            <div id="products-grid" class="products-grid">
                <div class="loading">載入中...</div>
            </div>
        </div>
    </div>
    
    <!-- 商品詳情 Modal -->
    <div class="modal" id="product-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">商品詳情</h2>
                <button class="close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- 動態內容 -->
            </div>
        </div>
    </div>
    
    <script>
        let allProducts = [];
        let claimsDb = {};
        let currentStatus = 'all';
        let currentType = 'all';
        let currentClaimType = 'all';
        let currentFilter = 'all';
        
        // 載入資料
        async function loadData() {
            try {
                const [productsRes, claimsRes] = await Promise.all([
                    fetch('data/products.json'),
                    fetch('data/claims_db.json')
                ]);
                allProducts = await productsRes.json();
                claimsDb = await claimsRes.json();
                updateStats();
                renderProducts();
            } catch (e) {
                console.error('載入失敗:', e);
                document.getElementById('products-grid').innerHTML = '<div class="empty-state"><div class="icon">❌</div><p>資料載入失敗</p></div>';
            }
        }
        
        // 更新統計
        function updateStats() {
            const 現售 = allProducts.filter(p => p.status === '現售').length;
            const 停售 = allProducts.filter(p => p.status === '停售').length;
            const 總數 = allProducts.length;
            
            document.getElementById('total-count').textContent = 總數;
            document.getElementById('count-all').textContent = 總數;
            document.getElementById('count-onsale').textContent = 現售;
            document.getElementById('count-discontinued').textContent = 停售;
            
            // 理賠類型統計
            const claimCounts = { 'all': 總數, '實支實付': 0, '日額型': 0, '手術': 0, '癌症': 0, '特定傷病': 0, '重大疾病': 0, '長照': 0, '意外': 0 };
            
            for (const [code, info] of Object.entries(claimsDb.products || {})) {
                const type = info.type || '其他';
                if (type.includes('實支') || type === '實支實付') claimCounts['實支實付']++;
                else if (type.includes('日額') || type === '日額型') claimCounts['日額型']++;
                else if (type.includes('手術')) claimCounts['手術']++;
                else if (type.includes('癌症')) claimCounts['癌症']++;
                else if (type.includes('特定傷病')) claimCounts['特定傷病']++;
                else if (type.includes('重大')) claimCounts['重大疾病']++;
                else if (type.includes('長照')) claimCounts['長照']++;
                else if (type.includes('意外')) claimCounts['意外']++;
            }
            
            document.getElementById('claim-count-all').textContent = claimCounts['all'];
            document.getElementById('claim-count-實支實付').textContent = claimCounts['實支實付'];
            document.getElementById('claim-count-日額型').textContent = claimCounts['日額型'];
            document.getElementById('claim-count-手術').textContent = claimCounts['手術'];
            document.getElementById('claim-count-癌症').textContent = claimCounts['癌症'];
            document.getElementById('claim-count-特定傷病').textContent = claimCounts['特定傷病'];
            document.getElementById('claim-count-重大疾病').textContent = claimCounts['重大疾病'];
            document.getElementById('claim-count-長照').textContent = claimCounts['長照'];
            document.getElementById('claim-count-意外').textContent = claimCounts['意外'];
            
            // 類型統計
            const typeCounts = {};
            allProducts.forEach(p => {
                const cat = p.category || '其他';
                typeCounts[cat] = (typeCounts[cat] || 0) + 1;
            });
            
            let typeListHtml = `
                <li class="category-item ${currentType === 'all' ? 'active' : ''}" data-type="all">
                    <span>全部類型</span>
                    <span class="count">${總數}</span>
                </li>
            `;
            for (const [type, count] of Object.entries(typeCounts)) {
                typeListHtml += `
                    <li class="category-item ${currentType === type ? 'active' : ''}" data-type="${type}">
                        <span>${type}</span>
                        <span class="count">${count}</span>
                    </li>
                `;
            }
            document.getElementById('type-list').innerHTML = typeListHtml;
        }
        
        // 取得商品代碼
        function getProductCode(filename) {
            return filename.split('_')[0];
        }
        
        // 取得理賠資訊
        function getClaimsInfo(filename) {
            const code = getProductCode(filename);
            
            // 嘗試精確匹配
            for (const [key, info] of Object.entries(claimsDb.products || {})) {
                if (key.includes(code) || filename.includes(key.split('_')[0])) {
                    return info;
                }
            }
            
            // 回傳預設資訊
            const cat = allProducts.find(p => p.filename === filename)?.category || '其他';
            return {
                name: filename.replace('.pdf', ''),
                type: cat,
                description: '點選查看詳細理賠項目'
            };
        }
        
        // 取得類型標籤class
        function getTypeClass(type) {
            if (type.includes('實支') || type === '實支實付') return '實支實付';
            if (type.includes('日額')) return '日額型';
            if (type.includes('手術')) return '手術醫療';
            if (type.includes('癌症')) return '癌症險';
            if (type.includes('特定傷病')) return '特定傷病';
            if (type.includes('重大')) return '重大疾病';
            if (type.includes('長照')) return '長期照護';
            if (type.includes('意外')) return '意外醫療';
            if (type.includes('壽')) return '壽險';
            if (type.includes('年金')) return '年金';
            if (type.includes('還本')) return '還本';
            if (type.includes('投資')) return '投資型';
            if (type.includes('團')) return '團險';
            return '其他';
        }
        
        // 篩選商品
        function filterProducts() {
            let filtered = [...allProducts];
            const searchValue = document.getElementById('search-input').value.toLowerCase();
            
            // 狀態篩選
            if (currentStatus !== 'all') {
                filtered = filtered.filter(p => p.status === currentStatus);
            }
            
            // 類型篩選
            if (currentType !== 'all') {
                filtered = filtered.filter(p => p.category === currentType);
            }
            
            // 理賠類型篩選
            if (currentClaimType !== 'all') {
                filtered = filtered.filter(p => {
                    const claims = getClaimsInfo(p.filename);
                    const type = claims.type || '';
                    if (currentClaimType === '實支實付') return type.includes('實支');
                    if (currentClaimType === '日額型') return type.includes('日額');
                    if (currentClaimType === '手術') return type.includes('手術');
                    if (currentClaimType === '癌症') return type.includes('癌症');
                    if (currentClaimType === '特定傷病') return type.includes('特定傷病');
                    if (currentClaimType === '重大疾病') return type.includes('重大');
                    if (currentClaimType === '長照') return type.includes('長照');
                    if (currentClaimType === '意外') return type.includes('意外');
                    return true;
                });
            }
            
            // 一般篩選
            if (currentFilter !== 'all') {
                if (currentFilter === '現售') filtered = filtered.filter(p => p.status === '現售');
                else if (currentFilter === '停售') filtered = filtered.filter(p => p.status === '停售');
                else if (currentFilter === '主約') filtered = filtered.filter(p => !p.is_rider);
                else if (currentFilter === '附約') filtered = filtered.filter(p => p.is_rider);
            }
            
            // 搜尋
            if (searchValue) {
                filtered = filtered.filter(p => p.filename.toLowerCase().includes(searchValue));
            }
            
            return filtered;
        }
        
        // 渲染商品列表
        function renderProducts() {
            const grid = document.getElementById('products-grid');
            const filtered = filterProducts();
            
            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>找不到符合條件的商品</p></div>';
                return;
            }
            
            grid.innerHTML = filtered.map(p => {
                const claims = getClaimsInfo(p.filename);
                const typeClass = getTypeClass(claims.type || p.category);
                const code = getProductCode(p.filename);
                
                // 取得理賠項目預覽
                let benefitsPreview = '';
                if (claims.benefits) {
                    const keys = Object.keys(claims.benefits).slice(0, 3);
                    benefitsPreview = keys.map(k => `<span>${k}</span>`).join('');
                } else if (claims.description) {
                    benefitsPreview = `<span>${p.category}</span>`;
                }
                
                return `
                    <div class="product-card" onclick="showProductDetail('${filenameToId(p.filename)}')">
                        <div class="header">
                            <div class="name">
                                ${p.filename.replace('.pdf','').substring(code.length + 1)}
                                <span class="code">${code}</span>
                            </div>
                            <span class="status-tag ${p.status}">${p.status}</span>
                        </div>
                        <div style="margin-bottom: 8px;">
                            <span class="type-tag ${typeClass}">${claims.type || p.category}</span>
                        </div>
                        <div class="benefits-preview">${benefitsPreview || '<span>' + p.category + '</span>'}</div>
                        <div class="footer">
                            <span class="meta">📁 ${p.category} | ${p.type}</span>
                            <span class="view-btn">查看理賠 →</span>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // 轉換檔名為ID
        function filenameToId(filename) {
            return filename.replace(/[^a-zA-Z0-9]/g, '_');
        }
        
        // 顯示商品詳情
        function showProductDetail(productId) {
            const filename = productId.replace(/_/g, '.pdf').replace(/_/g, ' ');
            const product = allProducts.find(p => filenameToId(p.filename) === productId || p.filename.includes(productId.replace(/_/g, '_')));
            
            if (!product) {
                // 嘗試模糊匹配
                const actualProduct = allProducts.find(p => p.filename.includes(productId.split('_')[0]));
                if (!actualProduct) {
                    alert('找不到商品資料');
                    return;
                }
            }
            
            const p = actualProduct || product;
            const claims = getClaimsInfo(p.filename);
            const modal = document.getElementById('product-modal');
            const body = document.getElementById('modal-body');
            const title = document.getElementById('modal-title');
            
            title.innerHTML = `
                <span class="type-tag ${getTypeClass(claims.type)}">${claims.type || p.category}</span>
                ${p.filename.replace('.pdf','')}
            `;
            
            let html = `
                <div class="detail-section">
                    <h4><span class="icon">📋</span>基本資訊</h4>
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="label">商品代碼</div>
                            <div class="value">${getProductCode(p.filename)}</div>
                        </div>
                        <div class="info-item">
                            <div class="label">商品類型</div>
                            <div class="value">${p.category}</div>
                        </div>
                        <div class="info-item">
                            <div class="label">承保型態</div>
                            <div class="value">${p.type}</div>
                        </div>
                        <div class="info-item">
                            <div class="label">銷售狀態</div>
                            <div class="value" style="color: ${p.status === '現售' ? '#64ffda' : '#ff6b6b'}">${p.status}</div>
                        </div>
                    </div>
                </div>
            `;
            
            // 理賠項目
            if (claims.benefits) {
                html += `
                    <div class="detail-section">
                        <h4><span class="icon">💰</span>理賠項目</h4>
                        <table class="benefits-table">
                            <thead>
                                <tr>
                                    <th>給付項目</th>
                                    <th>金額/計算方式</th>
                                    <th>說明</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                
                for (const [name, info] of Object.entries(claims.benefits)) {
                    html += `
                        <tr>
                            <td>${name}</td>
                            <td class="amount">${info.amount || info.calculation || '-'}</td>
                            <td class="note">${info.note || ''}</td>
                        </tr>
                    `;
                }
                
                html += `
                            </tbody>
                        </table>
                `;
                
                // 長期住院增額
                if (claims.benefits['住院醫療費用保險金']?.long_hospitalization) {
                    html += `
                        <div style="margin-top: 15px;">
                            <h5 style="font-size: 12px; color: #8892b0; margin-bottom: 10px;">📊 長期住院增額</h5>
                            <div class="info-grid">
                    `;
                    for (const [days, amount] of Object.entries(claims.benefits['住院醫療費用保險金'].long_hospitalization)) {
                        html += `
                            <div class="info-item">
                                <div class="label">${days}天</div>
                                <div class="value">${amount}</div>
                            </div>
                        `;
                    }
                    html += '</div></div>';
                }
                
                // 理算範例
                if (claims.claims_calculation) {
                    const calc = claims.claims_calculation;
                    html += `
                        <div class="calc-example">
                            <h5>💡 理算範例</h5>
                            <div class="scenario">
                                <strong>情境：</strong>住院10天（5天一般病房 + 5天加護病房），闌尾切除術
                            </div>
                    `;
                    
                    if (calc.type === '實支實付') {
                        html += `
                            <div class="calc-row"><span>每日病房費用保險金</span><span>1,000 × 10天 = 10,000</span></div>
                            <div class="calc-row"><span>加護病房費用保險金</span><span>3,000 × 5天 = 15,000</span></div>
                            <div class="calc-row"><span>手術費用保險金（闌尾切除術60%）</span><span>50,000 × 60% = 30,000</span></div>
                            <div class="calc-row"><span>出院在家療癒保險金</span><span>600 × 10天 = 6,000</span></div>
                            <div class="calc-row"><span>合計理賠</span><span>61,000元</span></div>
                        `;
                    } else {
                        html += `
                            <div class="calc-row"><span>住院醫療保險金</span><span>1,000 × 10天 = 10,000</span></div>
                            <div class="calc-row"><span>加護病房醫療保險金</span><span>1,000 × 2倍 × 5天 = 10,000</span></div>
                            <div class="calc-row"><span>住院醫療補助保險金</span><span>1,000 × 50% × 10天 = 5,000</span></div>
                            <div class="calc-row"><span>手術費用保險金（闌尾切除術8倍）</span><span>1,000 × 8倍 = 8,000</span></div>
                            <div class="calc-row"><span>合計理赔</span><span>33,000元</span></div>
                        `;
                    }
                    
                    html += '</div>';
                }
                
                // 警告
                if (calc?.type === '實支實付') {
                    html += `
                        <div class="warning-box">
                            <strong>⚠️ 重要提醒：</strong>實支實付型商品需檢附收據正本申請理賠，副本可能無法受理。
                        </div>
                    `;
                }
                
                html += '</div>';
            } else {
                html += `
                    <div class="detail-section">
                        <h4><span class="icon">📄</span>商品說明</h4>
                        <div class="info-item" style="grid-column: 1 / -1;">
                            <div class="value">${claims.description || '點選前往遠雄人壽官網下載保單條款 PDF 查看詳細理賠項目'}</div>
                        </div>
                    </div>
                `;
            }
            
            // 手術表
            if (claims.surgery_rates || claims.surgery_multipliers) {
                const surgeryData = claims.surgery_rates || claims.surgery_multipliers;
                html += `
                    <div class="detail-section">
                        <h4><span class="icon">🏥</span>手術參考表（常見手術）</h4>
                        <table class="benefits-table">
                            <thead>
                                <tr>
                                    <th>手術項目</th>
                                    <th>${claims.surgery_rates ? '百分率' : '倍數'}</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                for (const [name, rate] of Object.entries(surgeryData)) {
                    if (name !== 'url') {
                        html += `<tr><td>${name}</td><td class="amount">${rate}</td></tr>`;
                    }
                }
                html += '</tbody></table></div>';
            }
            
            // 下載連結
            html += `
                <div class="detail-section" style="text-align: center; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
                    <a href="https://www.fglife.com.tw/initGoodsTermsO.html" target="_blank" class="btn">
                        📥 前往遠雄官網下載保單條款
                    </a>
                </div>
            `;
            
            body.innerHTML = html;
            modal.classList.add('show');
        }
        
        // 關閉 Modal
        function closeModal() {
            document.getElementById('product-modal').classList.remove('show');
        }
        
        // 事件監聽
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderProducts();
            });
        });
        
        // 側邊欄篩選
        document.getElementById('status-list').addEventListener('click', e => {
            const item = e.target.closest('.category-item');
            if (item) {
                document.querySelectorAll('#status-list .category-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                currentStatus = item.dataset.filter;
                renderProducts();
            }
        });
        
        document.getElementById('type-list').addEventListener('click', e => {
            const item = e.target.closest('.category-item');
            if (item) {
                document.querySelectorAll('#type-list .category-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                currentType = item.dataset.type;
                renderProducts();
            }
        });
        
        document.getElementById('claim-type-list').addEventListener('click', e => {
            const item = e.target.closest('.category-item');
            if (item) {
                document.querySelectorAll('#claim-type-list .category-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                currentClaimType = item.dataset.claim;
                renderProducts();
            }
        });
        
        document.getElementById('search-input').addEventListener('input', () => {
            renderProducts();
        });
        
        // ESC 關閉 Modal
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
        });
        
        // 點擊背景關閉
        document.getElementById('product-modal').addEventListener('click', e => {
            if (e.target.id === 'product-modal') closeModal();
        });
        
        // 初始化
        loadData();
    </script>
</body>
</html>
