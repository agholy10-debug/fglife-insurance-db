<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>註冊 - 遠雄人壽保險商品查詢系統</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-container {
            background: rgba(0,0,0,0.3);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            color: #64ffda;
            font-size: 24px;
            margin-bottom: 10px;
        }
        .logo p {
            color: #8892b0;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ccd6f6;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #64ffda;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #64ffda;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #52e8c4;
            transform: translateY(-2px);
        }
        .error {
            background: rgba(255,107,107,0.2);
            color: #ff6b6b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }
        .links {
            text-align: center;
            margin-top: 20px;
            color: #8892b0;
            font-size: 14px;
        }
        .links a {
            color: #64ffda;
            text-decoration: none;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <h1>🏦 遠雄人壽</h1>
            <p>保險商品理賠查詢系統 - 會員註冊</p>
        </div>
        
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        
        <form method="POST">
            <div class="form-group">
                <label>帳號</label>
                <input type="text" name="username" required placeholder="至少 3 個字元">
            </div>
            <div class="form-group">
                <label>密碼</label>
                <input type="password" name="password" required placeholder="至少 4 個字元">
            </div>
            <div class="form-group">
                <label>確認密碼</label>
                <input type="password" name="password2" required placeholder="請再次輸入密碼">
            </div>
            <button type="submit" class="btn">註冊</button>
        </form>
        
        <div class="links">
            <a href="{{ url_for('login') }}">已有帳號？登入</a>
        </div>
    </div>
</body>
</html>
